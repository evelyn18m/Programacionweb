<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📌Tienda de Electrodomésticos</title>
  <link rel="stylesheet" href="cdnjs.cloudflare.com">
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          padding: 20px;
      }

      .container {
          max-width: 1400px;
          margin: 0 auto;
          background: white;
          border-radius: 20px;
          overflow: hidden;
          box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      }

      /* HEADER */
      header {
          background: linear-gradient(90deg, #2c3e50, #4a6491);
          color: white;
          padding: 30px;
          text-align: center;
      }

      .logo {
          font-size: 42px;
          margin-bottom: 10px;
          color: #ff6b6b;
      }

      .logo span {
          color: #4ecdc4;
      }

      .tagline {
          font-size: 18px;
          opacity: 0.9;
          margin-bottom: 20px;
      }

      /* CONTROLES */
      .controls {
          padding: 25px;
          background: #f8f9fa;
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
          justify-content: center;
          border-bottom: 3px solid #eee;
      }

      .search-box {
          flex: 1;
          min-width: 300px;
          max-width: 500px;
          position: relative;
      }

      .search-box input {
          width: 100%;
          padding: 15px 20px 15px 50px;
          border: 2px solid #ddd;
          border-radius: 50px;
          font-size: 16px;
          transition: all 0.3s;
      }

      .search-box input:focus {
          outline: none;
          border-color: #4ecdc4;
          box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
      }

      .search-icon {
          position: absolute;
          left: 20px;
          top: 50%;
          transform: translateY(-50%);
          color: #888;
      }

      .filter-buttons {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          justify-content: center;
      }

      .filter-btn {
          padding: 12px 25px;
          border: none;
          border-radius: 50px;
          background: white;
          color: #555;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s;
          border: 2px solid #ddd;
          display: flex;
          align-items: center;
          gap: 8px;
      }

      .filter-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .filter-btn.active {
          background: #4ecdc4;
          color: white;
          border-color: #4ecdc4;
      }

      /* PRODUCTOS */
      .products-section {
          padding: 30px;
      }

      .section-title {
          color: #2c3e50;
          margin-bottom: 20px;
          padding-bottom: 10px;
          border-bottom: 2px solid #4ecdc4;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }

      .product-count {
          background: #4ecdc4;
          color: white;
          padding: 5px 15px;
          border-radius: 20px;
          font-size: 14px;
      }

      .products-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
          gap: 25px;
      }

      .product-card {
          background: white;
          border-radius: 15px;
          overflow: hidden;
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
          transition: all 0.4s;
          position: relative;
          border: 1px solid #eee;
      }

      .product-card:hover {
          transform: translateY(-10px);
          box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      }

      .product-badge {
          position: absolute;
          top: 15px;
          right: 15px;
          background: #ff6b6b;
          color: white;
          padding: 5px 12px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: bold;
          z-index: 2;
      }

      .product-image {
          height: 180px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
      }

      .product-image i {
          display: none;
      }

      .product-info {
          padding: 20px;
      }

      .product-name {
          font-size: 18px;
          font-weight: bold;
          color: #2c3e50;
          margin-bottom: 10px;
          height: 50px;
          overflow: hidden;
      }

      .product-price {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 15px;
          flex-wrap: wrap;
      }

      .original-price {
          color: #888;
          text-decoration: line-through;
          font-size: 16px;
      }

      .current-price {
          color: #2c3e50;
          font-size: 24px;
          font-weight: bold;
      }

      .discount-price {
          color: #ff6b6b;
          font-size: 24px;
          font-weight: bold;
      }

      .discount-percent {
          background: #4ecdc4;
          color: white;
          padding: 3px 10px;
          border-radius: 15px;
          font-size: 14px;
          font-weight: bold;
      }

      .product-specs {
          color: #666;
          font-size: 14px;
          margin-top: 10px;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
      }

      .spec {
          background: #f8f9fa;
          padding: 5px 10px;
          border-radius: 10px;
          font-size: 12px;
      }

      footer {
          background: #2c3e50;
          color: white;
          padding: 25px;
          text-align: center;
          margin-top: 30px;
      }

      .stats {
          display: flex;
          justify-content: space-around;
          flex-wrap: wrap;
          gap: 20px;
          margin-top: 20px;
          padding-top: 20px;
          border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-item {
          text-align: center;
      }

      .stat-number {
          font-size: 28px;
          font-weight: bold;
          color: #4ecdc4;
      }

      .stat-label {
          font-size: 14px;
          opacity: 0.8;
          margin-top: 5px;
      }

      @media (max-width: 768px) {
          .products-grid {
              grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          }

          .controls {
              flex-direction: column;
          }

          .search-box {
              min-width: 100%;
          }
      }

      @media (max-width: 480px) {
          .products-grid {
              grid-template-columns: 1fr;
          }

          .filter-buttons {
              flex-direction: column;
              width: 100%;
          }

          .filter-btn {
              width: 100%;
              justify-content: center;
          }
      }

      .no-products {
          grid-column: 1 / -1;
          text-align: center;
          padding: 50px;
          color: #888;
          font-size: 18px;
      }

      .no-products i {
          font-size: 60px;
          margin-bottom: 20px;
          opacity: 0.5;
      }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <i class="fas fa-bolt"></i> ⚡ Cristian<span>Electro ⚡</span>
    </div>
    <h1>Tu Tienda de Electrodomésticos</h1>
    <p class="tagline">Los mejores electrodomésticos para tu hogar con garantía y calidad</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Buscar electrodoméstico (ej: refrigerador, lavadora...)">
    </div>

    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">
        <i class="fas fa-layer-group"></i> Todos (25)
      </button>
      <button class="filter-btn" data-filter="expensive">
        <i class="fas fa-crown"></i> +$500 (8)
      </button>
      <button class="filter-btn" data-filter="discount">
        <i class="fas fa-tag"></i> 12% Descuento (12)
      </button>
      <button class="filter-btn" data-filter="clear">
        <i class="fas fa-times"></i> Limpiar
      </button>
    </div>
  </div>


  <div class="products-section">
    <div class="section-title">
      <h2>Nuestros Electrodomésticos</h2>
      <div class="product-count">25 productos</div>
    </div>

    <div class="products-grid" id="productsGrid">

    </div>
  </div>


  <footer>
    <p>© 2026 CristianElectro - Todos los derechos reservados - Cenestur</p>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-number">25</div>
        <div class="stat-label">Productos</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">8</div>
        <div class="stat-label">+$500</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">12</div>
        <div class="stat-label">Con descuento</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">$18,420</div>
        <div class="stat-label">Valor total</div>
      </div>
    </div>
  </footer>
</div>

<script>

    const products = [

        { id: 1, name: "Refrigerador Samsung", price: 850, category: "Cocina", imageUrl: "https://crecos.vtexassets.com/arquivos/ids/351502/Refrigeradora-Samsung-RS27T5561B1-ED.jpg?v=638929530954430000", discount: true },
        { id: 2, name: "Lavadora LG", price: 620, category: "Lavandería", imageUrl: "https://bestpc.ec/wp-content/uploads/2023/08/17180610990.jpg", discount: true },
        { id: 3, name: "Microondas Panasonic", price: 180, category: "Cocina", imageUrl: "https://www.aki.com.ec/wp-content/uploads/2024/12/8887549850004-1-14.jpg", discount: false },
        { id: 4, name: "Licuadora Oster", price: 95, category: "Cocina", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVwILj79bDssrTBCzK3nI7UY8mxWIuA1V_tg&s", discount: true },
        { id: 5, name: "Horno Eléctrico", price: 320, category: "Cocina", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ9_LV466H9T_A4ZflCJNURiUXQ3FBUHycng&s", discount: false },
        { id: 6, name: "Televisor 55\" Sony", price: 1200, category: "Entretenimiento", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9umzJK4GMw7CamryXF8I3iIFvIdBsPXtUxQ&s", discount: true },
        { id: 7, name: "Aspiradora Dyson", price: 550, category: "Limpieza", imageUrl: "https://images-cdn.ubuy.qa/65b7904d485f927ff314ee66-dyson-v11-extra-cordless-vacuum-iron.jpg", discount: true },
        { id: 8, name: "Aire Acondicionado", price: 850, category: "Climatización", imageUrl: "https://www.lg.com/ec/images/aires-acondicionados/md07582341/gallery/D-04.jpg", discount: false },
        { id: 9, name: "Cafetera Nespresso", price: 220, category: "Cocina", imageUrl: "https://image.cdn0.buscalibre.com/3603559.__RS360x360__.jpg", discount: true },
        { id: 10, name: "Batidora KitchenAid", price: 350, category: "Cocina", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdnYvKV2Kft5nuejVWUKn4TaO_O4G4vpjI6g&s", discount: false },
        { id: 11, name: "Secadora de Ropa", price: 720, category: "Lavandería", imageUrl: "https://www.lg.com/ec/images/lavadoras-y-secadoras/md07550242/Gallery1/medium01.jpg", discount: true },
        { id: 12, name: "Purificador de Aire", price: 280, category: "Salud", imageUrl: "https://www.boyaca.com/wp-content/themes/boyaca/vista/imagenes/graf_zoom/43191-1.jpg?v=1598287229", discount: true },
        { id: 13, name: "Freidora de Aire", price: 120, category: "Cocina", imageUrl: "https://montero.ec/media/catalog/product/cache/d7b9b3e3077561ca75df95ce4e94f3d7/G/A/GAS0802030019022_2_1.png", discount: false },
        { id: 14, name: "Robot Aspirador", price: 480, category: "Limpieza", imageUrl: "https://images.deprati.com.ec/sys-master/images/h9c/he5/11654291816478/7896347186995-0_product_515Wx772H", discount: true },
        { id: 15, name: "Ventilador de Torre", price: 110, category: "Climatización", imageUrl: "https://crecos.vtexassets.com/arquivos/ids/237624/FZ10-21AR_2.jpg?v=638866336384030000", discount: false },
        { id: 16, name: "Plancha a Vapor", price: 85, category: "Lavandería", imageUrl: "https://tecnihogar.com.ec/image/cache/catalog/Planchas/SERIE%205000/GCSTBS5002_01-228x228.jpg", discount: true },
        { id: 17, name: "Horno Tostador", price: 75, category: "Cocina", imageUrl: "https://www.umcoecuador.com/7491-large_default/horno-tostador-14-l.jpg", discount: false },
        { id: 18, name: "Lavavajillas Bosch", price: 920, category: "Cocina", imageUrl: "https://i.ytimg.com/vi/_thrdjiVmF4/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLCi8KLKwlYsExp3r9Wnky-9TDyOpg", discount: true },
        { id: 19, name: "Extractor de Jugos", price: 130, category: "Cocina", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFTw-QIWdYqi4M06VKsZ4FpOom8jZJEM8ymw&s", discount: false },
        { id: 20, name: "Cocina Eléctrica", price: 420, category: "Cocina", imageUrl: "https://www.lg.com/cac/images/estufa/md07524862/gallery/D_08.jpg", discount: false },
        { id: 21, name: "Proyector 4K", price: 680, category: "Entretenimiento", imageUrl: "https://m.media-amazon.com/images/I/71um2gGipHL.jpg", discount: true },
        { id: 22, name: "Batidora de Mano", price: 65, category: "Cocina", imageUrl: "https://www.innova.ec/wp-content/uploads/2023/07/IN-BATIDORA_DE_MANO-149.png", discount: false },
        { id: 23, name: "Horno Microondas Grill", price: 250, category: "Cocina", imageUrl: "https://i.blogs.es/e2bd46/microondas-con-grill/500_333.jpeg", discount: true },
        { id: 24, name: "Deshumidificador", price: 310, category: "Climatización", imageUrl: "https://janomedical.com/wp-content/uploads/2024/08/deshumidificador-Simsen.jpg", discount: false },
        { id: 25, name: "Máquina de Coser", price: 380, category: "Hogar", imageUrl: "https://bestpc.ec/wp-content/uploads/2024/12/archivos-bestpc13-400x400.jpg", discount: true }
    ];

    const productsGrid = document.getElementById('productsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const productCountElement = document.querySelector('.product-count');

    let currentFilter = 'all';
    let searchTerm = '';


    const productsWithDiscount = products.map(product => {
        const discountPrice = product.discount ? product.price * 0.88 : product.price;
        return {
            ...product,
            discountPrice: Math.round(discountPrice * 100) / 100,
            discountAmount: product.discount ? product.price * 0.12 : 0
        };
    });

    function renderProducts(filteredProducts) {
        productsGrid.innerHTML = '';

        if (filteredProducts.length === 0) {
            productsGrid.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-search"></i>
                        <h3>No se encontraron productos</h3>
                        <p>Intenta con otros términos de búsqueda o filtros</p>
                    </div>
                `;
            return;
        }

        filteredProducts.forEach(product => {
            const productElement = document.createElement('div');
            productElement.className = 'product-card';

            const discountBadge = product.discount ?
                `<div class="product-badge">-12%</div>` : '';

            const priceHTML = product.discount ?
                `<span class="original-price">$${product.price}</span>
                     <span class="discount-price">$${product.discountPrice.toFixed(2)}</span>
                     <span class="discount-percent">-12%</span>` :
                `<span class="current-price">$${product.price}</span>`;

            productElement.innerHTML = `
                    ${discountBadge}
                    <div class="product-image">
                        <!-- MODIFICADO: Se usa la etiqueta <img> con la URL -->
                        <img src="${product.imageUrl}" alt="${product.name}" style="width: 100%; height: auto; max-height: 100%; object-fit: contain;">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">
                            ${priceHTML}
                        </div>
                        <div class="product-specs">
                            <span class="spec">${product.category}</span>
                            <span class="spec">${product.price >= 500 ? 'Premium' : 'Económico'}</span>
                            <span class="spec">${product.discount ? 'En oferta' : 'Precio regular'}</span>
                        </div>
                    </div>
                `;

            productsGrid.appendChild(productElement);
        });

        productCountElement.textContent = `${filteredProducts.length} productos`;
    }

    function filterProducts() {
        let filtered = [...productsWithDiscount];

        if (searchTerm) {
            filtered = filtered.filter(product =>
                product.name.toLowerCase().includes(searchTerm.toLowerCase())
            );
        }

        switch(currentFilter) {
            case 'expensive':
                filtered = filtered.filter(product => product.price >= 500);
                break;
            case 'discount':
                filtered = filtered.filter(product => product.discount);
                break;
            case 'clear':
                searchTerm = '';
                searchInput.value = '';
                currentFilter = 'all';
                updateActiveFilterButton();
                filtered = [...productsWithDiscount];
                break;
        }

        renderProducts(filtered);
    }

    function updateActiveFilterButton() {
        filterButtons.forEach(button => {
            if (button.dataset.filter === currentFilter) {
                button.classList.add('active');
            } else {
                button.classList.remove('active');
            }
        });
    }

    renderProducts(productsWithDiscount);

    searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        filterProducts();
    });

    filterButtons.forEach(button => {
        button.addEventListener('click', () => {
            currentFilter = button.dataset.filter;
            updateActiveFilterButton();
            filterProducts();
        });
    });

    const expensiveCount = products.filter(p => p.price >= 500).length;
    const discountCount = products.filter(p => p.discount).length;
    const totalValue = products.reduce((sum, p) => sum + p.price, 0);

    document.querySelectorAll('.stat-number')[1].textContent = expensiveCount;
    document.querySelectorAll('.stat-number')[2].textContent = discountCount;
    document.querySelectorAll('.stat-number')[3].textContent = `$${totalValue}`;
</script>
</body>
</html>
